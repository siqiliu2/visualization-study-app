<!DOCTYPE html>
<html>
<head>
  <title>Decision Tree Visualization</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  

  <style>
  body {
    font-family: 'Inter', sans-serif;
    background-image: url('{{ url_for('static', filename='background3.jpg') }}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
  width: 360px;
  background: #111111;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 15px 15px;
  box-sizing: border-box;
  }
  
  /* ---------- TOP HEADER ---------- */
    
    .top-header{
      position: relative;
      z-index: 2;   /* above background overlay */
      width: 100%;
      background: #007176;  /* umbc green */
      margin-bottom: 0px;
    }

    .top-header-inner{
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 18px;
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.3px;
      text-align: center;
    }   
    .page-layout {
      flex: 1;
      display: flex;
      width: 100%;
      min-height: 0;
    }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .show-all-btn {
    border: 1px solid rgba(255,255,255,0.16);
    width: 100%;
    padding: 10px 0px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    
  }

  .show-all-btn:hover {
    transform: translateY(-1px);
    filter: brightness(0.95);
  }

  .feature-card {
    border: 1px solid rgba(255,255,255,0.10);
    width: 100%;
    padding: 14px 14px;
    border-radius: 8px;
    background: #1b1b1b;
    color: white;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    box-sizing: border-box;
  }

  .feature-card:hover {
    transform: translateY(-1px);
    background: #262626;
    border-color: rgba(255,255,255,0.20);
  }

  .feature-card.active {
    outline: 2px solid rgba(255,255,255,0.18);
    background: #2c2c2c;
  }

  .feature-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .feature-swatch {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    display: inline-block;
    background: var(--feature-color);
    border: 1px solid rgba(255,255,255,0.18);
  }

  .feature-code {
    font-size: 13px;
    font-weight: 800;
    color: white;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .feature-desc {
    font-size: 14px;
    line-height: 1.35;
    color: rgba(255,255,255,0.82);
  }

  .school-icon {
    width: 180px;
    margin: 28px auto 10px auto;
    opacity: 0.92;
    transition: transform 0.3s ease;
  }

  .school-icon:hover {
    transform: scale(1.05);
  }

  /* Main content */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    padding: 40px;
    box-sizing: border-box;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
    margin-top: 30px;
    color: #000000;
  }

  h2 {
    color: white;
    margin-top: 50px;
  }


  img#tree-image {
    max-width: 100%;
    height: auto;
    margin-top: 50px
    margin: 40px auto 10px auto;
    display: block;
    border: none !important;
    padding: 16px 18px;
    background: transparent;
  }

  
  </style>
</head>

<body>
  <div class="top-header">
    <div class="top-header-inner">
      Decision Tree Visualization
    </div>
  </div>

  <div class="page-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="buttons">
        
        {% for feature, desc in feature_explanations.items() %}
          <button
            type="button"
            class="feature-card {% if selected == feature %}active{% endif %}"
            onclick="updateTree('{{ feature }}')"
            data-feature="{{ feature }}"
            style="--feature-color: {{ feature_colors.get(feature, '#D0D0D0') }};"
          >
            <div class="feature-header">
              <span class="feature-swatch"></span>
              <span class="feature-code">{{ feature }}</span>
            </div>
            <div class="feature-desc">{{ desc }}</div>
          </button>
        {% endfor %}
        <button type="button" class="show-all-btn" onclick="updateTree('')">Show All</button>
      </div>

    </div>

    <!-- Main content -->
    <div class="main-content">

      <img id="tree-image" src="{{ url_for('tree_image', feature=selected) }}">

      
    </div>
  </div>
  <script>
  function updateTree(feature) {
    const img = document.getElementById("tree-image");

    img.src = "/tree_image?feature=" + feature + "&t=" + new Date().getTime();

    document.querySelectorAll(".feature-card").forEach(card => {
      card.classList.remove("active");
      if (card.dataset.feature === feature) {
        card.classList.add("active");
      }
    });
  }
</script>
</body>
</html>
